# Legion SLVoice mixer — operator deployment.
#
# Quick start (a machine with only Docker needs just this file + env.sample):
#   1. cp env.sample .env
#   2. edit the three required values in .env
#   3. docker compose up -d
#   4. curl http://localhost:14223/voice/info   # lists janus.plugin.slvoice
#
# Config is generated inside the container from .env at start; you never edit
# files in the container. See the README "Install" section.

services:
  janus:
    image: ghcr.io/johnlegionh/legion-voice-mixer:latest

    # ── Developers only ──────────────────────────────────────────────────────
    # Build the image locally from source instead of pulling the published one.
    # Requires the full repo checkout with submodules (see README "Development").
    # Comment out the `image:` line above and uncomment this block:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    # ── Networking: bridge + explicit port mappings ──────────────────────────
    # This is the portable default and the ONLY mode that works on Docker Desktop
    # for Windows/macOS: there `network_mode: host` binds inside the WSL2/LinuxKit
    # VM and the ports are NOT reachable from the Windows/macOS host. The mapped
    # ports are driven by the same .env values the entrypoint uses to configure
    # Janus, so host and container ports always match (symmetric mapping).
    #
    # IMPORTANT (WebRTC media): under bridge networking Janus gathers ICE
    # candidates from the container's private IP, which is unreachable off-host.
    # Set JS_PUBLIC_IP in .env to this host's reachable IPv4 so Janus advertises
    # that instead (nat_1_1_mapping). Signalling — the /voice/info check — works
    # without it; media does not. See docs/docker-notes.md → "Windows/Docker
    # Desktop".
    #
    # O-55 narrowing is opt-in: with neither knob set, the ports below are the
    # pre-6m publish (docs/docker-notes.md → "Configuration compatibility rule").
    # JS_ADMIN_BIND = the host address the Admin API is published on; unset means
    # all interfaces (the entrypoint WARNs). To narrow, set it to the address in
    # the sim's JanusGatewayAdminURI (e.g. 192.168.1.225). JS_WS_ENABLED=false
    # stops Janus loading the WebSockets transport (the WS mapping then answers
    # nothing; delete that line to unpublish it too).
    ports:
      - "${JS_HTTP_PORT:-14223}:${JS_HTTP_PORT:-14223}/tcp"                        # HTTP signalling (/voice)
      - "${JS_ADMIN_BIND:+${JS_ADMIN_BIND:-}:}${JS_ADMIN_PORT:-14225}:${JS_ADMIN_PORT:-14225}/tcp" # Admin/monitor API (/voiceAdmin)
      - "${JS_WS_PORT:-8188}:${JS_WS_PORT:-8188}/tcp"                              # WebSockets signalling
      - "${JS_RTP_PORT_RANGE:-10000-10200}:${JS_RTP_PORT_RANGE:-10000-10200}/udp" # WebRTC media (RTP/RTCP)

    # ── Linux hosts (optional) ───────────────────────────────────────────────
    # On a native Linux host you may prefer host networking: it skips the
    # per-port userland proxy (lighter for the wide RTP range, which otherwise
    # spawns one docker-proxy per UDP port) and lets Janus see the real host
    # interfaces directly when gathering ICE candidates. NOT usable on Docker
    # Desktop (Windows/macOS) — see the note above. To use it, comment out the
    # entire `ports:` block above and uncomment this line:
    # network_mode: host

    # All operator-tunable values live in .env (copied from env.sample).
    env_file:
      - .env

    # Phase 1B echo-test knob, surfaced explicitly so it's discoverable. Default
    # false. Set SLV_ECHO_AUTOSTART=true in .env for the echo acceptance run (each
    # participant then hears itself ~500ms delayed), then set it back to false.
    # JS_ADMIN_BIND / JS_WS_ENABLED are passed with their defaults so the
    # entrypoint's first log lines report the effective values.
    environment:
      - SLV_ECHO_AUTOSTART=${SLV_ECHO_AUTOSTART:-false}
      - JS_ADMIN_BIND=${JS_ADMIN_BIND:-0.0.0.0}
      - JS_WS_ENABLED=${JS_WS_ENABLED:-true}

    # Keeps voice up across crashes and host reboots, and each (re)start
    # re-discovers a JS_PUBLIC_HOST address. REQUIRED for
    # JS_PUBLIC_IP_CHANGE_ACTION=restart: on a confirmed IP change the entrypoint's
    # watcher stops Janus, which exits 0, and this policy brings the container back
    # with the new address. Keep it `unless-stopped` or `always`. Under `on-failure`,
    # or with no policy, voice stays down after that restart. See
    # docs/docker-notes.md, "External access".
    restart: unless-stopped

    # ── Advanced config override (optional) ──────────────────────────────────
    # Drop complete Janus *.jcfg files here to override the env-generated config.
    # Precedence: mounted file > env > default (see docs/docker-notes.md).
    # volumes:
    #   - ./janus.d:/opt/janus/etc/janus.d:ro

  # ── Voice connector: recorder peer (S-CON-4) ───────────────────────────────
  # Headless aiortc peer that records one room's mixdown under a sim-registered
  # connector NPC identity. Behind a profile so `docker compose up -d` alone
  # NEVER starts it: bring it up explicitly with
  #   docker compose --profile recorder up -d recorder
  # Config: cp connectors/recorder/recorder.env.example connectors/recorder/recorder.env
  # (gitignored) and fill in JANUS_API_SECRET, ROOM, DISPLAY — the latter two from
  # the sim's "[CONNECTOR] registered ... npc=... room=..." line. See
  # connectors/recorder/README.md.
  recorder:
    build:
      # Context is connectors/ (not connectors/recorder) so the image can COPY
      # the common/ package the peers share.
      context: ./connectors
      dockerfile: recorder/Dockerfile
    profiles: [recorder]
    depends_on:
      - janus
    env_file:
      - ./connectors/recorder/recorder.env
    # JANUS_URL derives from the SAME .env value that configures the Janus HTTP
    # transport, so the recorder always targets the port Janus actually listens on
    # (the first live run went to a hard-coded 14223 while the live .env said
    # 24223). This entry overrides recorder.env: to point the recorder at a
    # non-compose Janus, set JANUS_URL in the mixer's .env, not in recorder.env.
    environment:
      JANUS_URL: ${JANUS_URL:-http://janus:${JS_HTTP_PORT:-14223}${JS_HTTP_BASEPATH:-/voice}}
    volumes:
      - ./recordings:/recordings
    restart: unless-stopped

  # ── Voice connector: injector peer (S-CON-6) ───────────────────────────────
  # Sends audio into one room under a sim-registered connector NPC identity,
  # fed from an s16 WAV file or named pipe in ./injector-in (SOURCE). The sim
  # record MUST carry MayInject=true — with MayInject=false the registration-
  # time moderation mute silences this peer for every listener (S-CON-5(e)).
  # Behind a profile so `docker compose up -d` alone NEVER starts it:
  #   docker compose --profile injector up -d injector
  # Config: cp connectors/injector/injector.env.example connectors/injector/injector.env
  # (gitignored) and fill in JANUS_API_SECRET, ROOM, DISPLAY. See
  # connectors/injector/README.md.
  injector:
    build:
      context: ./connectors
      dockerfile: injector/Dockerfile
    profiles: [injector]
    depends_on:
      - janus
    env_file:
      - ./connectors/injector/injector.env
    # Same JANUS_URL derivation as the recorder (see that service's note): the
    # compose-derived value overrides injector.env.
    environment:
      JANUS_URL: ${JANUS_URL:-http://janus:${JS_HTTP_PORT:-14223}${JS_HTTP_BASEPATH:-/voice}}
    volumes:
      - ./injector-in:/injector       # drop or stream the source WAV here (SOURCE=/injector/in.wav)
      - ./recordings:/recordings      # used only with RECORD=1
    restart: unless-stopped

  # ── TEST FIXTURE ONLY: TURN server (slice A.3) — NOT FOR PRODUCTION ──────────
  # legion-voice ships no TURN server. Operators who need mixer-side TURN (a CGNAT or otherwise unreachable
  # mixer) run their own, typically coturn, and point JS_TURN_* at it (docs/docker-notes.md, "TURN for the
  # mixer"). This coturn and the REST backend below exist only to exercise JS_TURN_*, the self-check's C6
  # and the harness's relay scenario (S13). They use throwaway credentials, a certificate generated at
  # start, and no hardening. Behind a profile, so `docker compose up -d` alone NEVER starts them:
  #   docker compose --profile turn-test up -d turn-test turn-test-rest
  #   docker compose --profile turn-test rm -sf turn-test turn-test-rest     # tear down
  # Shared-secret mode (coturn cannot mix it with static users). Throwaway credentials:
  #   REST:   JS_TURN_REST_API=http://turn-test-rest:8089/turn  JS_TURN_REST_API_KEY=turn-test-api-key
  #   static: JS_TURN_SERVER=turn-test  JS_TURN_USER=2145916800:legion-voice-static
  #           JS_TURN_PWD=NGwezoW6rFCQ0gcjQKg34HJa1W8=   (a long-lived pair derived from the secret; its
  #           expiry, 2038-01-01, must stay below 2^31: coturn rejects a later timestamp)
  turn-test:
    image: coturn/coturn:4.6.3
    profiles: [turn-test]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        openssl req -x509 -newkey rsa:2048 -nodes -days 7 -subj /CN=turn-test
        -keyout /tmp/turn-test.key -out /tmp/turn-test.crt >/dev/null 2>&1 &&
        exec turnserver -n --log-file=stdout --no-cli --fingerprint
        --realm=legion-voice-turn-test --use-auth-secret --static-auth-secret=turn-test-secret
        --listening-port=3478 --tls-listening-port=5349
        --cert=/tmp/turn-test.crt --pkey=/tmp/turn-test.key
        --min-port=49160 --max-port=49200
    ports:
      - "3478:3478/udp"   # TURN over UDP and TCP, also for the harness on the host
      - "3478:3478/tcp"
      - "5349:5349/tcp"   # TURN over TLS
    restart: "no"

  turn-test-rest:
    # TEST FIXTURE ONLY: the mixer image's python3 running docker/turn-test/turn_rest_backend.py.
    image: ghcr.io/johnlegionh/legion-voice-mixer:latest
    profiles: [turn-test]
    entrypoint: ["python3", "/fixture/turn_rest_backend.py"]
    environment:
      TURN_TEST_SECRET: turn-test-secret
      TURN_TEST_API_KEY: turn-test-api-key
      TURN_TEST_URIS: "turn:turn-test:3478?transport=udp,turn:turn-test:3478?transport=tcp,turns:turn-test:5349?transport=tcp"
    volumes:
      - ./docker/turn-test:/fixture:ro
    restart: "no"
