# Legion SLVoice mixer — operator deployment.
#
# Quick start (a machine with only Docker needs just this file + env.sample):
#   1. cp env.sample .env
#   2. edit the three required values in .env
#   3. docker compose up -d
#   4. curl http://localhost:14223/voice/info   # lists janus.plugin.slvoice
#
# Config is generated inside the container from .env at start; you never edit
# files in the container. See the README "Install" section.

services:
  janus:
    image: ghcr.io/johnlegionh/legion-voice-mixer:latest

    # ── Developers only ──────────────────────────────────────────────────────
    # Build the image locally from source instead of pulling the published one.
    # Requires the full repo checkout with submodules (see README "Development").
    # Comment out the `image:` line above and uncomment this block:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    # ── Networking: bridge + explicit port mappings ──────────────────────────
    # This is the portable default and the ONLY mode that works on Docker Desktop
    # for Windows/macOS: there `network_mode: host` binds inside the WSL2/LinuxKit
    # VM and the ports are NOT reachable from the Windows/macOS host. The mapped
    # ports are driven by the same .env values the entrypoint uses to configure
    # Janus, so host and container ports always match (symmetric mapping).
    #
    # IMPORTANT (WebRTC media): under bridge networking Janus gathers ICE
    # candidates from the container's private IP, which is unreachable off-host.
    # Set JS_PUBLIC_IP in .env to this host's reachable IPv4 so Janus advertises
    # that instead (nat_1_1_mapping). Signalling — the /voice/info check — works
    # without it; media does not. See docs/docker-notes.md → "Windows/Docker
    # Desktop".
    ports:
      - "${JS_HTTP_PORT:-14223}:${JS_HTTP_PORT:-14223}/tcp"                        # HTTP signalling (/voice)
      - "${JS_ADMIN_PORT:-14225}:${JS_ADMIN_PORT:-14225}/tcp"                      # Admin/monitor API (/voiceAdmin)
      - "${JS_WS_PORT:-8188}:${JS_WS_PORT:-8188}/tcp"                              # WebSockets signalling
      - "${JS_RTP_PORT_RANGE:-10000-10200}:${JS_RTP_PORT_RANGE:-10000-10200}/udp" # WebRTC media (RTP/RTCP)

    # ── Linux hosts (optional) ───────────────────────────────────────────────
    # On a native Linux host you may prefer host networking: it skips the
    # per-port userland proxy (lighter for the wide RTP range, which otherwise
    # spawns one docker-proxy per UDP port) and lets Janus see the real host
    # interfaces directly when gathering ICE candidates. NOT usable on Docker
    # Desktop (Windows/macOS) — see the note above. To use it, comment out the
    # entire `ports:` block above and uncomment this line:
    # network_mode: host

    # All operator-tunable values live in .env (copied from env.sample).
    env_file:
      - .env

    # Phase 1B echo-test knob, surfaced explicitly so it's discoverable. Default
    # false. Set SLV_ECHO_AUTOSTART=true in .env for the echo acceptance run (each
    # participant then hears itself ~500ms delayed), then set it back to false.
    environment:
      - SLV_ECHO_AUTOSTART=${SLV_ECHO_AUTOSTART:-false}

    # Keeps voice up across crashes and host reboots. Note for JS_PUBLIC_HOST
    # users: on each (re)start the entrypoint re-resolves the hostname to an
    # IPv4, so a reboot picks up a changed dynamic IP automatically. A mid-run
    # IP change still needs an explicit `docker compose restart`. See env.sample.
    restart: unless-stopped

    # ── Advanced config override (optional) ──────────────────────────────────
    # Drop complete Janus *.jcfg files here to override the env-generated config.
    # Precedence: mounted file > env > default (see docs/docker-notes.md).
    # volumes:
    #   - ./janus.d:/opt/janus/etc/janus.d:ro

  # ── Voice connector: recorder peer (S-CON-4) ───────────────────────────────
  # Headless aiortc peer that records one room's mixdown under a sim-registered
  # connector NPC identity. Behind a profile so `docker compose up -d` alone
  # NEVER starts it: bring it up explicitly with
  #   docker compose --profile recorder up -d recorder
  # Config: cp connectors/recorder/recorder.env.example connectors/recorder/recorder.env
  # (gitignored) and fill in JANUS_API_SECRET, ROOM, DISPLAY — the latter two from
  # the sim's "[CONNECTOR] registered ... npc=... room=..." line. See
  # connectors/recorder/README.md.
  recorder:
    build:
      context: ./connectors/recorder
    profiles: [recorder]
    depends_on:
      - janus
    env_file:
      - ./connectors/recorder/recorder.env
    # JANUS_URL derives from the SAME .env value that configures the Janus HTTP
    # transport, so the recorder always targets the port Janus actually listens on
    # (the first live run went to a hard-coded 14223 while the live .env said
    # 24223). This entry overrides recorder.env: to point the recorder at a
    # non-compose Janus, set JANUS_URL in the mixer's .env, not in recorder.env.
    environment:
      JANUS_URL: ${JANUS_URL:-http://janus:${JS_HTTP_PORT:-14223}${JS_HTTP_BASEPATH:-/voice}}
    volumes:
      - ./recordings:/recordings
    restart: unless-stopped
