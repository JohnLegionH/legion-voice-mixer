name: release

# Build and publish the container image on every version tag (e.g. v0.1.0).
# Operators then just `docker pull ghcr.io/johnlegionh/legion-voice-mixer` —
# no clone, no submodules, no build tools.
on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: ghcr.io/johnlegionh/legion-voice-mixer

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
          # linux/arm64 is intentionally disabled for now. Enabling it needs an
          # arm64 tag of the base image (shivanshtalwar0/januscoredeps), and —
          # because this is a matrix of single-platform builds pushing shared
          # tags — a follow-up job to merge the per-arch images into one manifest
          # list (docker buildx imagetools create) instead of clobbering :latest.
          # - platform: linux/arm64

    steps:
      - name: Checkout (with the pinned Janus submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Uses the repo Dockerfile unchanged (it builds Janus v1.4.1 from the
      # submodule and already handles the CRLF + libtool fixes).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
