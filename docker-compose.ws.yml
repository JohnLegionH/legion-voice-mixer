# Optional overlay: publish the Janus WebSockets transport (O-55).
#
# The base docker-compose.yml neither enables nor publishes WebSockets — the
# OpenSim sim talks to Janus over HTTP only. Use this overlay only for a client
# that needs WS, and set JS_WS_ENABLED=true in .env too (the entrypoint keeps the
# transport unloaded otherwise, so this port would answer nothing). Either:
#   docker compose -f docker-compose.yml -f docker-compose.ws.yml up -d janus
# or, in .env:
#   COMPOSE_PATH_SEPARATOR=:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ws.yml
services:
  janus:
    ports:
      - "${JS_WS_PORT:-8188}:${JS_WS_PORT:-8188}/tcp"                              # WebSockets signalling
